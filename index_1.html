<title>Spedytor CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eef1f1;
  --surface:#ffffff;
  --surface-2:#f6f8f8;
  --ink:#17262b;
  --ink-2:#48595f;
  --muted:#7d8d92;
  --border:#dde4e5;
  --border-strong:#c7d1d2;
  --accent:#1f6f6a;
  --accent-2:#2c8a83;
  --accent-soft:#e4efee;
  --good:#2e7d5b;
  --good-soft:#e3f1ea;
  --warn:#b3760a;
  --warn-soft:#f6ecd8;
  --crit:#bb4630;
  --crit-soft:#f6e2dd;
  --shadow:0 1px 2px rgba(19,38,43,.06),0 6px 20px rgba(19,38,43,.06);
  --shadow-lg:0 12px 40px rgba(19,38,43,.18);
  --radius:12px;
  --radius-sm:8px;
  --col-w:288px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --paper:#0e1618;
    --surface:#152023;
    --surface-2:#1a282b;
    --ink:#e8eeee;
    --ink-2:#aebabd;
    --muted:#7f9195;
    --border:#26383c;
    --border-strong:#33484d;
    --accent:#4bb3aa;
    --accent-2:#63c4bb;
    --accent-soft:#173032;
    --good:#5cc48c;
    --good-soft:#15332a;
    --warn:#d69a34;
    --warn-soft:#33290f;
    --crit:#e07a63;
    --crit-soft:#3a2019;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
    --shadow-lg:0 12px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1618;
  --surface:#152023;
  --surface-2:#1a282b;
  --ink:#e8eeee;
  --ink-2:#aebabd;
  --muted:#7f9195;
  --border:#26383c;
  --border-strong:#33484d;
  --accent:#4bb3aa;
  --accent-2:#63c4bb;
  --accent-soft:#173032;
  --good:#5cc48c;
  --good-soft:#15332a;
  --warn:#d69a34;
  --warn-soft:#33290f;
  --crit:#e07a63;
  --crit-soft:#3a2019;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  --shadow-lg:0 12px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;height:60px;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--border);z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;font-size:16px}
.brand .logo{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;box-shadow:0 2px 8px rgba(31,111,106,.35);
}
.brand .logo svg{width:19px;height:19px}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.nav{display:flex;gap:3px;margin-left:6px}
.nav button{
  border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13.5px;
  padding:8px 13px;border-radius:9px;display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button svg{width:16px;height:16px;opacity:.8}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.topbar-tools{display:flex;align-items:center;gap:9px}
.langswitch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.langswitch button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;letter-spacing:.03em}
.langswitch button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;transition:.15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:12.5px}

/* ---------- Main / views ---------- */
.main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.view-head{
  flex:0 0 auto;padding:16px 22px 12px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
}
.view-head h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.view-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

/* ---------- Kanban ---------- */
.board-wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:2px 22px 20px}
.board{display:flex;gap:14px;height:100%;min-width:min-content;align-items:flex-start}
.col{
  width:var(--col-w);flex:0 0 var(--col-w);background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;max-height:100%;
}
.col-head{padding:11px 13px 9px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.col-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.col-head h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
.col-body{padding:0 9px 9px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1;min-height:36px}
.col.drop-hint{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 12px 10px;box-shadow:var(--shadow);cursor:grab;position:relative;overflow:hidden;transition:.12s;
  border-left:3px solid var(--border-strong);
}
.card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card.urg-high{border-left-color:var(--crit)}
.card.urg-medium{border-left-color:var(--warn)}
.card.urg-low{border-left-color:var(--good)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.card-ref{font-size:11px;font-weight:600;color:var(--muted)}
.card-mode{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.card-client{font-weight:700;font-size:14px;letter-spacing:-.01em;margin-bottom:3px}
.card-route{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);margin-bottom:9px}
.card-route svg{width:13px;height:13px;color:var(--muted);flex:0 0 auto}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
.margin-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.margin-tag.good{background:var(--good-soft);color:var(--good)}
.margin-tag.warn{background:var(--warn-soft);color:var(--warn)}
.margin-tag.crit{background:var(--crit-soft);color:var(--crit)}
.card-people{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:9.5px;font-weight:800;flex:0 0 auto}
.card-flags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--crit-soft);color:var(--crit)}
.flag svg{width:11px;height:11px}
.flag.info{background:var(--surface-2);color:var(--ink-2)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:stretch;justify-content:flex-end}
.overlay.open{display:flex}
.drawer{
  width:min(640px,100%);background:var(--surface);height:100%;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:slidein .22s ease;
}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.drawer-head .dh-main{flex:1;min-width:0}
.drawer-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.drawer-head .sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 26px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.section{margin-bottom:20px}
.section > h4{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.field .val{font-size:13.5px;font-weight:600}
.fin{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fin .field{text-align:left}
.fin .val{font-size:16px}
.fin .field.mar .val.good{color:var(--good)}
.fin .field.mar .val.warn{color:var(--warn)}
.fin .field.mar .val.crit{color:var(--crit)}
.fin .field.mar .pct{font-size:11px;font-weight:600;color:var(--muted)}

/* timeline */
.timeline{position:relative;padding-left:4px}
.tl{display:flex;gap:11px;padding-bottom:13px;position:relative}
.tl:last-child{padding-bottom:0}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);margin-top:4px;flex:0 0 auto;box-shadow:0 0 0 3px var(--accent-soft);position:relative;z-index:1}
.tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--border)}
.tl-main{flex:1}
.tl-main .t{font-weight:600;font-size:13px}
.tl-main .m{font-size:11.5px;color:var(--muted);margin-top:1px}

/* messages */
.msg{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:9px;background:var(--surface-2)}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.chan{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.chan svg{width:11px;height:11px}
.chan.email{background:#e5eefb;color:#2a5cab}
.chan.whatsapp{background:#e2f3e6;color:#2c8a4a}
.chan.note{background:var(--surface);color:var(--ink-2);border:1px solid var(--border)}
:root[data-theme="dark"] .chan.email,:root:not([data-theme="light"]) .chan.email{background:#18314f;color:#7fb0f0}
:root[data-theme="dark"] .chan.whatsapp,:root:not([data-theme="light"]) .chan.whatsapp{background:#173a25;color:#6fd68f}
.msg-head .who{font-weight:700;font-size:12.5px}
.msg-head .when{font-size:11px;color:var(--muted);margin-left:auto}
.msg-subj{font-weight:600;font-size:12.5px;margin-bottom:2px}
.msg-body{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}

/* docs */
.doclist{display:flex;flex-direction:column;gap:7px}
.doc{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)}
.doc svg{width:16px;height:16px;color:var(--accent);flex:0 0 auto}
.doc .dn{font-weight:600;font-size:12.5px;flex:1}
.doc .dm{font-size:11px;color:var(--muted)}
.doc.missing{opacity:.7;border-style:dashed}
.doc.missing svg{color:var(--muted)}

/* ---------- Templates ---------- */
.scroll-body{flex:1;min-height:0;overflow-y:auto;padding:2px 22px 24px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;max-width:1100px}
.tpl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.tpl-card .tc-top{display:flex;align-items:center;gap:8px}
.tpl-cat{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.tpl-card h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.tpl-preview{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;line-height:1.55;max-height:112px;overflow:hidden;position:relative;white-space:pre-wrap}
.tpl-preview::after{content:"";position:absolute;inset:auto 0 0 0;height:26px;background:linear-gradient(transparent,var(--surface-2))}
.tpl-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.tpl-foot .grow{flex:1}

/* ---------- Analytics ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-bottom:16px;max-width:1200px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab svg{width:14px;height:14px;color:var(--accent)}
.kpi .num{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1}
.kpi .num small{font-size:15px;font-weight:700;color:var(--muted)}
.kpi .trend{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--good);display:flex;align-items:center;gap:5px}
.kpi .trend svg{width:13px;height:13px;flex:0 0 auto}
.kpi .trend.down{color:var(--good)}
.charts{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;max-width:1200px;align-items:start}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3 svg{width:16px;height:16px;color:var(--accent)}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-lab{width:150px;flex:0 0 150px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar-val{width:74px;flex:0 0 74px;text-align:right;font-size:12px;font-weight:700}
.status-bars{display:flex;flex-direction:column;gap:9px}
.sb{display:flex;align-items:center;gap:9px}
.sb .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sb .slab{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .strack{width:130px;flex:0 0 130px;height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.sb .sfill{height:100%;border-radius:20px}
.sb .sval{width:24px;flex:0 0 24px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-2)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fn{position:relative;background:var(--accent-soft);border-radius:8px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.fn .fbg{position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.16}
.fn .fl{font-weight:600;font-size:12.5px;position:relative}
.fn .fv{font-weight:800;font-size:13px;position:relative}
.perf-table{width:100%;border-collapse:collapse;font-size:12.5px}
.perf-table th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px;border-bottom:1px solid var(--border)}
.perf-table th.r,.perf-table td.r{text-align:right}
.perf-table td{padding:9px 8px;border-bottom:1px solid var(--border)}
.perf-table tr:last-child td{border-bottom:0}
.perf-name{display:flex;align-items:center;gap:8px;font-weight:600}

/* reminders banner */
.reminders{max-width:1200px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.rem{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:var(--radius-sm);background:var(--warn-soft);border:1px solid transparent;font-size:12.5px}
.rem svg{width:16px;height:16px;color:var(--warn);flex:0 0 auto}
.rem .rt{flex:1}
.rem .rt b{font-weight:700}
.rem .rref{font-size:11px;color:var(--ink-2);font-weight:600;background:var(--surface);padding:2px 8px;border-radius:6px;border:1px solid var(--border)}
.rem.crit{background:var(--crit-soft)}
.rem.crit svg{color:var(--crit)}

/* form modal */
.modal-c{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,20,22,.5);backdrop-filter:blur(3px);padding:20px}
.modal-c.open{display:flex}
.modal-box{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(520px,100%);max-height:90vh;overflow-y:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.modal-box header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-box header h2{margin:0;font-size:16px;font-weight:800}
.modal-box .mbody{padding:18px 20px}
.modal-box .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:9px 11px;font-family:inherit;font-size:13.5px;margin-bottom:12px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.55}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tpick{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;max-height:200px;overflow-y:auto}
.tpick button{text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.tpick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.tpick .tp-t{font-weight:700;font-size:12.5px}

/* ============ Persistence ============ */
const LS="spedytor_crm_v1";
let DB={orders:[],templates:[]};
function load(){
  try{const raw=localStorage.getItem(LS);if(raw){DB=JSON.parse(raw);}}catch(e){}
  if(!DB.orders||!DB.orders.length){DB={orders:seedOrders(),templates:JSON.parse(JSON.stringify(SEED_TEMPLATES))};save();}
  if(!DB.templates||!DB.templates.length){DB.templates=JSON.parse(JSON.stringify(SEED_TEMPLATES));}
}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}

/* ============ Helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>n==null?"—":new Intl.NumberFormat(LANG==="pl"?"pl-PL":"en-GB",{maximumFractionDigits:0}).format(n)+" €";
const initials=n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function marginOf(o){if(o.carrierRate==null||o.clientRate==null)return null;return o.clientRate-o.carrierRate;}
function marginPct(o){const m=marginOf(o);if(m==null||!o.clientRate)return null;return m/o.clientRate;}
function marginClass(o){const p=marginPct(o);if(p==null)return "info";if(p>=0.28)return "good";if(p>=0.15)return "warn";return "crit";}
function daysSince(at){return Math.floor((now-at)/DAY);}
function timeLabel(at){const d=daysSince(at);if(d<=0)return t("today");return d+" "+t("days_ago");}
function fillTpl(str,o){return str
  .replace(/{ref}/g,o.ref).replace(/{origin}/g,o.origin).replace(/{destination}/g,o.destination)
  .replace(/{client}/g,o.client).replace(/{carrier}/g,o.carrier==="—"?"":o.carrier)
  .replace(/{cargo}/g,o.cargo).replace(/{rate}/g,o.clientRate??"")
  .replace(/{forwarder}/g,FWD[o.fwd]?.name||"");}

/* ============ Render: Board ============ */
function renderBoard(){
  const board=$("#board");
  board.innerHTML=STAGES.map(st=>{
    const orders=DB.orders.filter(o=>o.status===st);
    const meta=STAGE_META[st];
    return `<div class="col" data-stage="${st}">
      <div class="col-head"><span class="col-dot" style="background:${meta.color}"></span>
        <h3>${esc(t(meta.key))}</h3><span class="col-count">${orders.length}</span></div>
      <div class="col-body" data-drop="${st}">${orders.map(cardHTML).join("")}</div>
    </div>`;
  }).join("");
  bindDnD();
}
function reminderFlags(o){
  const f=[];
  if((o.status==="transit"||o.status==="customs")&&!o.docs.invoice) f.push({key:"rem_docs",crit:true});
  if(o.status==="booking"&&!hasEvent(o,"transit")&&daysSince(lastEventAt(o))>=1) f.push({key:"rem_pickup",crit:false});
  if(o.status==="quote"&&!o.messages.some(m=>m.dir==="out")) f.push({key:"rem_quote",crit:false});
  if(["quote","booking","transit"].includes(o.status)&&daysSince(lastMsgAt(o))>=3) f.push({key:"rem_stale",crit:false});
  return f;
}
function hasEvent(o,st){return o.events.some(e=>e.status===st);}
function lastEventAt(o){return o.events.reduce((m,e)=>Math.max(m,e.at),0);}
function lastMsgAt(o){return o.messages.length?o.messages.reduce((m,x)=>Math.max(m,x.at),0):o.createdAt;}
function cardHTML(o){
  const mc=marginClass(o), m=marginOf(o), flags=reminderFlags(o);
  return `<div class="card urg-${o.urgency}" draggable="true" data-id="${o.id}" tabindex="0">
    <div class="card-top"><span class="card-ref mono">${o.ref}</span><span class="card-mode">${o.mode}</span></div>
    <div class="card-client">${esc(o.client)}</div>
    <div class="card-route">${IC.route}<span>${esc(o.origin)} → ${esc(o.destination)}</span></div>
    ${flags.length?`<div class="card-flags">${flags.slice(0,2).map(f=>`<span class="flag ${f.crit?"":"info"}">${IC.alert}${esc(t(f.key))}</span>`).join("")}</div>`:""}
    <div class="card-foot">
      <span class="margin-tag ${mc}">${m==null?"—":eur(m)}</span>
      <span class="card-people"><span class="avatar">${initials(FWD[o.fwd].name)}</span></span>
    </div>
  </div>`;
}
function bindDnD(){
  let dragId=null;
  $$(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
    c.addEventListener("dragend",()=>{dragId=null;c.classList.remove("dragging");$$(".col").forEach(x=>x.classList.remove("drop-hint"));});
    c.addEventListener("click",()=>openDrawer(c.dataset.id));
    c.addEventListener("keydown",e=>{if(e.key==="Enter")openDrawer(c.dataset.id);});
  });
  $$(".col").forEach(col=>{
    const body=$(".col-body",col);
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drop-hint");});
    col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("drop-hint");});
    col.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("drop-hint");
      const st=col.dataset.stage;const o=DB.orders.find(x=>x.id===dragId);
      if(o&&o.status!==st){o.status=st;if(!hasEvent(o,st))o.events.push(ev(st,o.fwd,now));save();renderBoard();toast(t("toast_moved"));}
    });
  });
}

function msgHTML(m){
  const ci=m.channel==="email"?IC.mail:m.channel==="whatsapp"?IC.wa:IC.note;
  const clab=m.channel==="email"?t("ch_email"):m.channel==="whatsapp"?t("ch_whatsapp"):t("ch_note");

  const body=typeof m.body==="object"?m.body[LANG]:m.body;
  return `<div class="msg"><div class="msg-head"><span class="chan ${m.channel}">${ci}${esc(clab)}</span><span class="who">${esc(who)}${m.dir==="out"?" · "+esc(t("you")):""}</span><span class="when">${esc(timeLabel(m.at))}</span></div>${subj?`<div class="msg-subj">${esc(subj)}</div>`:""}<div class="msg-body">${esc(body)}</div></div>`;
}

function drawerAction(act,o){
  if(act==="advance"){
    const i=STAGES.indexOf(o.status);if(i<STAGES.length-1){o.status=STAGES[i+1];if(!hasEvent(o,o.status))o.events.push(ev(o.status,o.fwd,now));save();renderBoard();openDrawer(o.id);toast(t("toast_moved"));}
    return;
  }
  if(act==="note"){openNoteModal(o);return;}
  if(act==="update"){openTemplateModal(o,["quote","booking","pickup","transit","customs","delivered","docs"]);return;}
  if(act==="rates"){openTemplateModal(o,["rates"],true);return;}
}

/* ============ Analytics ============ */
function renderAnalytics(){
  const active=DB.orders.filter(o=>!["closed"].includes(o.status));
  // avg response = quote event - new event (days) where available
  const respDays=[];
  DB.orders.forEach(o=>{const n=o.events.find(e=>e.status==="new"),q=o.events.find(e=>e.status==="quote");if(n&&q&&q.at>=n.at)respDays.push((q.at-n.at)/DAY);});
  const avgResp=respDays.length?respDays.reduce((a,b)=>a+b,0)/respDays.length:0;
  const avgRespH=Math.max(4,Math.round(avgResp*7)); // pseudo working-hours
  // conversion inquiry->booking
  const reached=st=>DB.orders.filter(o=>STAGES.indexOf(o.status)>=STAGES.indexOf(st)||o.events.some(e=>e.status===st)).length;
  const inquiries=DB.orders.length, bookings=reached("booking");
  const conv=inquiries?Math.round(bookings/inquiries*100):0;
  // avg margin %
  const mps=DB.orders.map(marginPct).filter(x=>x!=null);
  const avgMar=mps.length?Math.round(mps.reduce((a,b)=>a+b,0)/mps.length*100):0;
  // messages this "week"
  const wk=DB.orders.reduce((a,o)=>a+o.messages.filter(m=>daysSince(m.at)<=7).length,0);

  const kpis=[
    {lab:"kpi_orders",icon:IC.box,num:active.length,sub:t("st_new")+" – "+t("st_customs"),trend:""},
    {lab:"kpi_response",icon:IC.clock,num:avgRespH+"<small> "+t("hours")+"</small>",sub:t("resp_avg"),trend:"−58% "+t("vs_last")},
    {lab:"kpi_conv",icon:IC.target,num:conv+"<small>%</small>",sub:t("conv_sub"),trend:"+14% "+t("vs_last")},
    {lab:"kpi_margin",icon:IC.coins,num:avgMar+"<small>%</small>",sub:t("margin"),trend:""},
    {lab:"kpi_msgs",icon:IC.mail,num:wk,sub:t("kpi_msgs"),trend:""}
  ];
  // reminders
  const rems=[];
  DB.orders.forEach(o=>reminderFlags(o).forEach(f=>rems.push({o,f})));
  // status counts
  const counts=STAGES.map(st=>({st,n:DB.orders.filter(o=>o.status===st).length}));
  const maxN=Math.max(1,...counts.map(c=>c.n));
  // margin by direction (dest country)
  const dir={};
  DB.orders.forEach(o=>{const m=marginOf(o);if(m==null)return;const key=o.origin.split(",").pop().trim()+" → "+o.destination.split(",").pop().trim();dir[key]=(dir[key]||0)+m;});
  const dirArr=Object.entries(dir).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxDir=Math.max(1,...dirArr.map(d=>d[1]));
  // funnel
  const funnel=[["st_new",reached("new")],["st_quote",reached("quote")],["st_booking",reached("booking")],["st_transit",reached("transit")],["st_delivered",reached("delivered")]];
  const maxFn=Math.max(1,...funnel.map(f=>f[1]));
  // forwarder perf
  const perf={};
  Object.keys(FWD).forEach(k=>perf[k]={orders:0,margin:0,resp:[]});
  DB.orders.forEach(o=>{const p=perf[o.fwd];p.orders++;const m=marginOf(o);if(m!=null)p.margin+=m;const n=o.events.find(e=>e.status==="new"),q=o.events.find(e=>e.status==="quote");if(n&&q&&q.at>=n.at)p.resp.push((q.at-n.at)/DAY);});

  $("#analyticsBody").innerHTML=`
    ${rems.length?`<div class="reminders">${rems.slice(0,4).map(r=>`<div class="rem ${r.f.crit?"crit":""}">${IC.alert}<span class="rt"><b>${esc(t(r.f.key))}</b> — ${esc(r.o.client)}</span><span class="rref mono">${r.o.ref}</span></div>`).join("")}</div>`:""}
    <div class="kpis">${kpis.map(k=>`<div class="kpi"><div class="lab">${k.icon}${esc(t(k.lab))}</div><div class="num mono">${k.num}</div>${k.trend?`<div class="trend down">${IC.check}${esc(k.trend)}</div>`:`<div class="trend" style="color:var(--muted)">${esc(k.sub)}</div>`}</div>`).join("")}</div>
    <div class="charts">
      <div class="panel">
        <h3>${IC.coins}${esc(t("an_dir"))}</h3>
        ${dirArr.map(([k,v])=>`<div class="bar-row"><span class="bar-lab">${esc(k)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.round(v/maxDir*100)}%"></span></span><span class="bar-val mono">${eur(v)}</span></div>`).join("")}
      </div>
      <div class="panel">
        <h3>${IC.box}${esc(t("an_status"))}</h3>
        <div class="status-bars">${counts.map(c=>`<div class="sb"><span class="sdot" style="background:${STAGE_META[c.st].color}"></span><span class="slab">${esc(t(STAGE_META[c.st].key))}</span><span class="strack"><span class="sfill" style="width:${Math.round(c.n/maxN*100)}%;background:${STAGE_META[c.st].color}"></span></span><span class="sval mono">${c.n}</span></div>`).join("")}</div>
      </div>
      <div class="panel">
        <h3>${IC.target}${esc(t("an_funnel"))}</h3>
        <div class="funnel">${funnel.map(([k,v])=>`<div class="fn" style="width:${Math.max(42,Math.round(v/maxFn*100))}%"><span class="fbg"></span><span class="fl">${esc(t(k))}</span><span class="fv mono">${v}</span></div>`).join("")}</div>
      </div>
      <div class="panel">
        <h3>${IC.route}${esc(t("an_perf"))}</h3>
        <table class="perf-table"><thead><tr><th>${esc(t("perf_name"))}</th><th class="r">${esc(t("perf_orders"))}</th><th class="r">${esc(t("perf_margin"))}</th><th class="r">${esc(t("perf_resp"))}</th></tr></thead>
        <tbody>${Object.entries(perf).map(([k,p])=>`<tr><td class="perf-name"><span class="avatar">${initials(FWD[k].name)}</span>${esc(FWD[k].name)}</td><td class="r mono">${p.orders}</td><td class="r mono">${eur(p.margin)}</td><td class="r mono">${p.resp.length?Math.max(4,Math.round(p.resp.reduce((a,b)=>a+b,0)/p.resp.length*7))+t("hours"):"—"}</td></tr>`).join("")}</tbody></table>
      </div>
    </div>`;
}

/* ============ New order ============ */
function openNewOrder(){
  const clients=[...new Set(DB.orders.map(o=>o.client))];
  const carriers=[...new Set(DB.orders.map(o=>o.carrier).filter(c=>c!=="—"))];
  openModal(`<header><h2>${esc(t("new_order_title"))}</h2><button class="icon-btn" id="mX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
    <div class="mbody">
      <div style="display:flex;gap:10px"><div style="flex:1"><span class="flabel">${esc(t("f_client"))}</span><input class="inp" id="oClient" list="clist" placeholder="Kowalski Sp. z o.o."><datalist id="clist">${clients.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div style="flex:1"><span class="flabel">${esc(t("f_carrier"))}</span><input class="inp" id="oCarrier" list="crlist" placeholder="—"><datalist id="crlist">${carriers.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div></div>
      <div style="display:flex;gap:10px"><div style="flex:1"><span class="flabel">${esc(t("f_origin"))}</span><input class="inp" id="oOrigin" placeholder="Gdańsk, PL"></div>
      <div style="flex:1"><span class="flabel">${esc(t("f_dest"))}</span><input class="inp" id="oDest" placeholder="Berlin, DE"></div></div>
      <div style="display:flex;gap:10px"><div style="flex:1"><span class="flabel">${esc(t("f_mode"))}</span><select class="inp" id="oMode"><option>FTL</option><option>LTL</option><option>FCL</option><option>LCL</option></select></div>
      <div style="flex:1"><span class="flabel">${esc(t("cargo"))}</span><input class="inp" id="oCargo" placeholder="12 pal."></div></div>
      <div style="display:flex;gap:10px"><div style="flex:1"><span class="flabel">${esc(t("f_clientrate"))}</span><input class="inp mono" id="oCR" type="number" placeholder="1450"></div>
      <div style="flex:1"><span class="flabel">${esc(t("f_carrierrate"))}</span><input class="inp mono" id="oKR" type="number" placeholder=""></div></div>
      <div style="display:flex;gap:10px"><div style="flex:1"><span class="flabel">${esc(t("f_urg"))}</span><select class="inp" id="oUrg"><option value="low">${esc(t("urg_low"))}</option><option value="medium" selected>${esc(t("urg_medium"))}</option><option value="high">${esc(t("urg_high"))}</option></select></div>
      <div style="flex:1"><span class="flabel">${esc(t("f_fwd"))}</span><select class="inp" id="oFwd">${Object.entries(FWD).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join("")}</select></div></div>
    </div>
    <div class="mfoot"><button class="btn ghost" id="mCancel">${esc(t("cancel"))}</button><button class="btn primary" id="mSave">${esc(t("save_order"))}</button></div>`);
  $("#mX").onclick=$("#mCancel").onclick=closeModal;
  $("#mSave").onclick=()=>{
    const client=$("#oClient").value.trim()||"—";
    const ref="PL-"+(2413+DB.orders.filter(o=>o.ref.startsWith("PL-")).length);
    const cr=parseFloat($("#oCR").value)||null, kr=parseFloat($("#oKR").value)||null;
    const o=order(ref,client,$("#oCarrier").value.trim()||"—",$("#oOrigin").value.trim()||"—",$("#oDest").value.trim()||"—",$("#oMode").value,$("#oCargo").value.trim()||"—","EXW",cr,kr,"new",$("#oUrg").value,$("#oFwd").value,now,[],{invoice:false,packing:false,cmr:false},[ev("new",$("#oFwd").value,now)]);
    DB.orders.unshift(o);save();closeModal();renderBoard();toast(t("toast_created"));
  };
}

/* ============ UI plumbing ============ */
function applyLang(){
  $$("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i);});
  document.documentElement.lang=LANG;
  renderBoard();renderTemplates();renderAnalytics();
  if(currentOrder)openDrawer(currentOrder.id);
}
function setView(v){
  $$(".view").forEach(x=>x.classList.toggle("active",x.id==="view-"+v));
  $$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  if(v==="analytics")renderAnalytics();
  if(v==="templates")renderTemplates();
}
let toastTimer;
function toast(msg){const el=$("#toast");el.innerHTML=IC.check+"<span>"+esc(msg)+"</span>";el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200);}

$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.view);});
$$(".langswitch button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;$$(".langswitch button").forEach(x=>x.classList.toggle("active",x===b));try{localStorage.setItem("spedytor_lang",LANG);}catch(e){}applyLang();});
$("#newOrderBtn").onclick=openNewOrder;
$("#newTplBtn").onclick=()=>openTplEditor(null);
$("#resetBtn").onclick=()=>{try{localStorage.removeItem(LS);}catch(e){}DB={orders:seedOrders(),templates:JSON.parse(JSON.stringify(SEED_TEMPLATES))};save();applyLang();toast(t("toast_reset"));};

/* theme */
function getTheme(){try{return localStorage.getItem("spedytor_theme");}catch(e){return null;}}
function setTheme(mode){
  if(mode)document.documentElement.setAttribute("data-theme",mode);else document.documentElement.removeAttribute("data-theme");
  const dark=mode==="dark"||(!mode&&matchMedia("(prefers-color-scheme:dark)").matches);
  $("#themeIcon").innerHTML=dark
    ?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    :'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';
}
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);const next=dark?"light":"dark";try{localStorage.setItem("spedytor_theme",next);}catch(e){}setTheme(next);};

/* init */
(function init(){
  try{const l=localStorage.getItem("spedytor_lang");if(l)LANG=l;}catch(e){}
  $$(".langswitch button").forEach(x=>x.classList.toggle("active",x.dataset.lang===LANG));
  setTheme(getTheme());
  load();
  applyLang();
})();
</script>
